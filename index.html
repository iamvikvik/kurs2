<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс валют</title>
<meta name="theme-color" content="#232323">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Курс">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="kurs.webmanifest">
<link rel="apple-touch-icon" href="kurs-icon-180.png">
<link rel="icon" href="kurs-icon-192.png">
<style>
:root{--bg:#171717;--card:#212121;--pink:#f8a8d4;--pink2:#ffd0ea;--tx:#fff;--mut:#9b9b9b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

.hero{position:relative;background:linear-gradient(#242424,#171717);padding-top:env(safe-area-inset-top)}
.hero img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.datechip{position:absolute;left:4.2%;top:calc(env(safe-area-inset-top) + 74%);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:#eee;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:9px 14px}
.datechip svg{width:19px;height:19px;stroke:#f3a9d2;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{padding:0 14px;display:flex;flex-direction:column;flex:1;margin-top:-6px}
.inp{background:linear-gradient(180deg,#2a2a2a,#1e1e1e);border:1px solid rgba(255,255,255,.06);border-radius:26px;padding:13px 16px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cap{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.cap b{color:var(--pink);font-weight:600}
.amtline{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
#amt{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;color:#fff;font-family:var(--font);font-weight:600;font-size:clamp(34px,11vw,44px);line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0;caret-color:var(--pink)}
#amt::placeholder{color:rgba(255,255,255,.25)}
.curtag{font-weight:700;font-size:15px;color:#3a1830;background:linear-gradient(180deg,var(--pink2),var(--pink));padding:5px 12px;border-radius:999px}
.chips{display:flex;gap:5px}
.chip{flex:1;border:1px solid rgba(255,255,255,.12);color:#cfcfcf;padding:8px 0;font-size:12px;font-weight:600;border-radius:12px;text-align:center}
.chip.on{background:linear-gradient(180deg,var(--pink2),var(--pink));color:#3a1830;border-color:transparent}

.list{margin-top:12px;display:grid;gap:10px}
.row{min-width:0;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,#262626,#1e1e1e);border:1px solid rgba(255,255,255,.05);border-radius:28px;padding:11px 20px 11px 12px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.row:active{background:#2c2c2c}
.flag{flex:none;width:46px;height:46px;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.nm{flex:none;display:flex;flex-direction:column;min-width:0}
.nm b{font-size:21px;font-weight:700;letter-spacing:-.01em}
.nm small{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:116px}
@media(max-width:370px){.nm small{max-width:80px}.nm b{font-size:19px}}
.val{flex:1;min-width:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.val b{font-size:clamp(21px,7vw,29px);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.val small{font-size:11.5px;color:#7d7d7d;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.hint{margin:12px 8px 0;font-size:12px;line-height:1.45;color:#7d7d7d}
.strip{margin-top:auto;padding:18px 6px calc(18px + env(safe-area-inset-bottom))}
.upd{width:100%;height:64px;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:999px;font-size:21px;font-weight:600;color:#2a1022;background:linear-gradient(180deg,#ffd6ee 0%,#fbb2da 55%,#f598c9 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 10px rgba(214,90,160,.45),0 8px 22px rgba(0,0,0,.55)}
.upd:active{transform:scale(.985)}
.upd svg{width:28px;height:28px;stroke:#2a1022;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.upd.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#2c2c2c;color:#fff;border:1px solid rgba(255,255,255,.1);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:5;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <img src="banner.jpg" alt="Курс валют" width="949" height="548">
    <span class="datechip"><span id="rdate">—</span><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
  </header>
  <main class="wrap">
    <section class="inp">
      <div class="cap"><span>Ты вводишь</span><b id="basename">Российский рубль</b></div>
      <div class="amtline"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Сумма"><span class="curtag" id="curtag">RUB</span></div>
      <div class="chips" id="chips"></div>
    </section>
    <section class="list" id="list" aria-live="polite"></section>
    <p class="hint" id="hint">Нажми на строку, чтобы считать от этой валюты.</p>
    <p class="hint" id="note"></p>
    <footer class="strip">
      <button class="upd" id="refresh" aria-label="Обновить курс"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>Обновить</button>
    </footer>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const CUR = [
  {c:'RUB', n:'Российский рубль'},
  {c:'GBP', n:'Фунт стерлингов'},
  {c:'USD', n:'Доллар США'},
  {c:'EUR', n:'Евро'},
  {c:'AED', n:'Дирхам ОАЭ'},
  {c:'AMD', n:'Армянский драм'},
  {c:'TRY', n:'Турецкая лира'}
];
// запасной курс, если нет интернета и ещё ничего не сохранялось (курс на 10.10.2026, 1 USD = ...)
const FALLBACK = { date:'2026-10-10', rates:{USD:1, RUB:84.989692, GBP:0.77, EUR:0.892383, AED:3.6725, AMD:361.957381, TRY:49.339277}, approx:true };
const KEY='kurs_v1', RKEY='kurs_rates_v1', MAXAGE=3*3600*1000;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st={base:'RUB', amt:'1000'};
let rates=null; // {date, rates, t, approx}

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }


function parseAmt(s){ const v=parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.')); return isFinite(v)&&v>=0?v:0; }
function fmt(v){
  if(!isFinite(v)) return '0';
  const a=Math.abs(v);
  const d = a>=1000?0 : a>=1?2 : a>0?4 : 0;
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}).format(v);
}
function convert(v,from,to){ const r=rates.rates; return v/r[from]*r[to]; }
function dstr(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?m[3]+'.'+m[2]+'.'+m[1]:'—'; }
function rateTxt(from,to){
  const r=convert(1,to,from); const d=r>=100?2:r>=1?3:5;
  return '1 '+to+' = '+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}).format(r)+' '+from;
}

function render(keepInput){
  const base=CUR.find(x=>x.c===st.base);
  $('#curtag').textContent=base.c; $('#basename').textContent=base.n;
  if(!keepInput) $('#amt').value=st.amt;
  $('#chips').innerHTML=CUR.map(x=>'<button class="chip'+(x.c===st.base?' on':'')+'" data-base="'+x.c+'">'+x.c+'</button>').join('');
  const v=parseAmt(st.amt);
  $('#list').innerHTML=CUR.filter(x=>x.c!==st.base).map(x=>
    '<button class="row" data-pick="'+x.c+'"><img class="flag" src="flag-'+x.c+'.png" alt="" width="46" height="46"><span class="nm"><b>'+x.c+'</b><small>'+esc(x.n)+'</small></span>'+
    '<span class="val"><b>'+esc(fmt(convert(v,st.base,x.c)))+'</b><small>'+esc(rateTxt(st.base,x.c))+'</small></span></button>').join('');
  const d=dstr(rates.date);
  $('#rdate').textContent=d;
  $('#note').textContent=(rates.approx?'Примерный курс на '+d+': не удалось загрузить свежий. ':'')+'Курс ориентировочный (рыночный): в банках и обменниках он обычно немного отличается.';
}

function save(){ lsSet(KEY,st); }
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200); }

async function getJSON(url){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  try{ const r=await fetch(url,{signal:ctl.signal,cache:'no-store'}); if(!r.ok) throw new Error('http'); return await r.json(); } finally{ clearTimeout(to); }
}
function pick(all){ const out={USD:1}; for(const x of CUR){ if(x.c==='USD') continue; const v=all[x.c]; if(!(v>0)) throw new Error('bad'); out[x.c]=v; } return out; }
async function loadRates(manual){
  const btn=$('#refresh'); btn.classList.add('spin');
  try{
    let got=null;
    try{
      const j=await getJSON('https://open.er-api.com/v6/latest/USD');
      if(j.result==='success'){ got={date:new Date(j.time_last_update_utc||Date.now()).toISOString().slice(0,10), rates:pick(j.rates)}; }
    }catch(e){}
    if(!got){
      const j=await getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
      const up={}; for(const k in j.usd) up[k.toUpperCase()]=j.usd[k];
      got={date:j.date, rates:pick(up)};
    }
    rates={date:got.date, rates:got.rates, t:Date.now()}; lsSet(RKEY,rates); render(true);
    if(manual) toast('Курс обновлён ✓');
  }catch(e){
    if(manual) toast('Нет интернета. Показан сохранённый курс');
  }finally{ btn.classList.remove('spin'); }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-base]'), p=e.target.closest('[data-pick]');
  if(b){
    const nb=b.dataset.base; if(nb===st.base) return;
    const v=parseAmt(st.amt); const nv=convert(v,st.base,nb);
    st.base=nb; st.amt=String(Math.round(nv*100)/100).replace('.',','); save(); render();
  }
  if(p){
    const nb=p.dataset.pick; const v=parseAmt(st.amt); const nv=convert(v,st.base,nb);
    st.base=nb; st.amt=String(Math.round(nv*100)/100).replace('.',','); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
  }
});
$('#amt').addEventListener('input',e=>{
  let s=e.target.value.replace(/[^0-9.,\s]/g,''); if(s!==e.target.value) e.target.value=s;
  st.amt=s; save(); render(true);
});
$('#amt').addEventListener('focus',e=>setTimeout(()=>e.target.select(),0));
$('#refresh').addEventListener('click',()=>loadRates(true));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && (!rates||Date.now()-(rates.t||0)>MAXAGE)) loadRates(false); });

// старт
const s0=lsGet(KEY); if(s0&&CUR.some(x=>x.c===s0.base)&&typeof s0.amt==='string') st=s0;
const cached=lsGet(RKEY);
if(cached&&cached.rates&&CUR.every(x=>cached.rates[x.c]>0)) rates=cached; else rates=Object.assign({},FALLBACK);
render();
if(!cached||Date.now()-(cached.t||0)>MAXAGE) loadRates(false); else loadRates(false);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
